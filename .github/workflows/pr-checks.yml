name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-lint:
    name: App lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run pretty:check

  app-integration:
    name: App integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      # Dummy credentials for DynamoDB Local; no real AWS access is used.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      AWS_DYNAMODB_ENDPOINT: http://localhost:8000
      # serverless-offline breaks with require(esm) on newer Node 20 releases
      NODE_OPTIONS: --no-experimental-require-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Create DynamoDB table
        run: |
          aws dynamodb create-table \
            --endpoint-url "$AWS_DYNAMODB_ENDPOINT" \
            --table-name todo-table \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
      - name: Start API
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for API
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://0.0.0.0:3001/dev/api/todos; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          cat server.log
          exit 1
      - run: npm run test:integration
      - name: Show server log on failure
        if: failure()
        run: cat server.log
      - name: Stop API
        if: always()
        run: kill "$(cat server.pid)" || true

  infra:
    name: Infra build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
